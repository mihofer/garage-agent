name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (spectrogram test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg sqlite3
      - name: Run tests (stdlib-only suite)
        run: |
          pip install pytest
          python -m pytest tests/ -v

  docker:
    # Multi-arch: native runners per platform (public repos get ARM runners
    # free — much faster than QEMU emulation of pip/torch layers).
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare push metadata
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          PLATFORM_PAIR=${PLATFORM//\//-}
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "platform_pair=$PLATFORM_PAIR" >> "$GITHUB_OUTPUT"
      - name: Build (push by digest on main/tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.prep.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=build-${{ steps.prep.outputs.platform_pair }}
          cache-to: type=gha,scope=build-${{ steps.prep.outputs.platform_pair }},mode=max
      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.prep.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Combine per-arch digests into one multi-arch manifest (latest + semver).
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' \
            <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest
